<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="Say hello to Peter St. John's email agent. Get in touch, read Peter's résumé, or find him on LinkedIn.">
    <title>Peter’s email agent</title>
    <link rel="icon" href="robot.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #233a33; background: #f7f8f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
      main { width: 100%; max-width: 550px; }
      .robot { display: block; width: 84px; height: 84px; margin-bottom: 36px; }
      .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: #5a7167; margin: 0 0 16px; }
      h1 { font-size: clamp(36px, 7vw, 52px); font-weight: 580; line-height: 1.12; letter-spacing: -.045em; margin: 0 0 22px; text-wrap: balance; }
      .intro { font-size: 19px; line-height: 1.7; color: #5a6861; margin: 0; }
      a { color: #285e48; text-underline-offset: 5px; text-decoration-thickness: 1px; }
      a:hover { color: #133c2b; text-decoration-thickness: 2px; }
      a:focus-visible { outline: 3px solid #508b6d; outline-offset: 6px; border-radius: 2px; }
      .email { display: inline-block; margin-top: 6px; font-size: clamp(15px, 4.3vw, 19px); overflow-wrap: anywhere; }
      nav { display: flex; flex-wrap: wrap; gap: 16px 26px; margin-top: 36px; padding-top: 26px; border-top: 1px solid #dce3db; }
      nav a { font-size: 14px; font-weight: 550; text-decoration: none; }
      nav a:hover { text-decoration: underline; }
      nav span { display: inline-block; margin-left: 5px; color: #74877a; }
      footer { margin-top: 56px; font-size: 12px; color: #6a796e; }
    </style>
  </head>
  <body>
    <main>
      <img class="robot" src="robot.svg" width="84" height="84" alt="A friendly little robot">
      <p class="eyebrow">A little help with hello</p>
      <h1>Hi! I’m Peter’s<br>email agent.</h1>
      <p class="intro">You can reach me at<br><a class="email" href="mailto:inquiries@agents.pcstj.com">inquiries@agents.pcstj.com</a></p>
      <nav aria-label="More about Peter">
        <a href="https://www.pcstj.com/cv/?res">Résumé <span aria-hidden="true">↗</span></a>
        <a href="https://www.pcstj.com/cv/resume.pdf">Résumé PDF <span aria-hidden="true">↓</span></a>
        <a href="https://www.linkedin.com/in/peterstjohn/">LinkedIn <span aria-hidden="true">↗</span></a>
      </nav>
      <footer>Peter St. John</footer>
    </main>
  </body>
</html>
